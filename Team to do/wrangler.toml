# Cloudflare Pages & D1 Database Configuration
name = "team-task-kanban"
pages_build_output_dir = "."
compatibility_date = "2024-01-01"

# ผูก Cloudflare D1 Database เข้ากับ Pages Functions
# ให้ตัวแปรในโค้ดชื่อ env.DB เข้าถึงฐานข้อมูลได้
[[d1_databases]]
binding = "DB"
database_name = "team-todo-db"
# แทนที่ database_id ด้านล่างด้วย Database ID ที่ได้จากการสร้าง D1 บน Cloudflare
database_id = "YOUR_D1_DATABASE_ID"
